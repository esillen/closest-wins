<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Join - Closest Wins</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
	<nav>
		<ul>
			<li class="logo"><a href="/">Closest Wins</a></li>
			<li><a href="/play">Play</a></li>
			<li><a href="/spectate">Spectate</a></li>
			<li th:if="${isAdmin}"><a href="/players">Players</a></li>
			<li th:if="${isAdmin}"><a href="/admin/locations">Locations</a></li>
		</ul>
	</nav>
	
	<main>
		<div class="content narrow">
			<h1 class="center">Join</h1>
			<div th:if="${error}" class="error-inline">
				<span th:text="${error}"></span>
			</div>
			<form method="post" action="/join">
				<div class="form-group">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" placeholder="Enter your name" required>
				</div>
				<div class="form-group">
					<label for="emoji">Emoji</label>
					<div class="emoji-picker-wrapper">
						<div class="emoji-display">
							<button type="button" class="emoji-button" id="emojiButton" onclick="toggleEmojiPicker()">
								<span id="emojiDisplay">😀</span>
							</button>
							<input type="hidden" id="emoji" name="emoji" value="😀" required>
							<small class="text-muted">Click to select an emoji</small>
						</div>
						<div class="emoji-picker" id="emojiPicker">
							<div class="emoji-categories">
								<button type="button" class="emoji-category active" onclick="showEmojiCategory('smileys')">😀</button>
								<button type="button" class="emoji-category" onclick="showEmojiCategory('people')">👤</button>
								<button type="button" class="emoji-category" onclick="showEmojiCategory('animals')">🐶</button>
								<button type="button" class="emoji-category" onclick="showEmojiCategory('food')">🍕</button>
								<button type="button" class="emoji-category" onclick="showEmojiCategory('activities')">⚽</button>
								<button type="button" class="emoji-category" onclick="showEmojiCategory('objects')">🎮</button>
								<button type="button" class="emoji-category" onclick="showEmojiCategory('symbols')">⭐</button>
							</div>
							<div class="emoji-grid" id="emojiGrid"></div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<label for="color">Color</label>
					<div class="color-picker-wrapper">
						<div class="color-display">
							<button type="button" class="color-button" id="colorButton">
								<div class="color-swatch" id="colorSwatch" style="background-color: #667eea;"></div>
							</button>
							<input type="color" id="color" name="color" value="#667eea" required style="position: absolute; opacity: 0; pointer-events: none;">
							<small class="text-muted">Click to select a color</small>
						</div>
					</div>
				</div>
				<button type="submit">Join</button>
			</form>
		</div>
	</main>

			event.target.classList.add('active');
		}
		
		function selectEmoji(emoji) {
			document.getElementById('emojiDisplay').textContent = emoji;
			document.getElementById('emoji').value = emoji;
			document.getElementById('emojiButton').classList.add('has-emoji');
			document.getElementById('emojiPicker').classList.remove('show');
		}
		
		function updateColorPreview() {
			const colorInput = document.getElementById('color');
			const swatch = document.getElementById('colorSwatch');
			const button = document.getElementById('colorButton');
			if (swatch && colorInput) {
				swatch.style.backgroundColor = colorInput.value;
				button.classList.add('has-color');
			}
		}
		
		// Close emoji picker when clicking outside
		document.addEventListener('click', function(event) {
			const picker = document.getElementById('emojiPicker');
			const button = document.getElementById('emojiButton');
			if (!picker.contains(event.target) && !button.contains(event.target)) {
				picker.classList.remove('show');
			}
		});
		
		// Setup color picker button
		const colorButton = document.getElementById('colorButton');
		const colorInput = document.getElementById('color');
		
		if (colorButton && colorInput) {
			colorButton.addEventListener('click', function(e) {
				e.preventDefault();
				e.stopPropagation();
				colorInput.click();
			});
			
			colorInput.addEventListener('change', function() {
				updateColorPreview();
			});
		}
		
		// Initialize emoji picker and color preview
		showEmojiCategory('smileys');
		updateColorPreview();
	</script>
	
	<!-- Session Status Component -->
	<div th:replace="~{fragments/session-status :: session-status}"></div>
</body>
</html>
