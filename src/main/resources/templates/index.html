<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Closest Wins - by Flower Games</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<style>
		/* Override body to remove nav spacing */
		body {
			padding: 0;
		}
		
		/* Landing page specific styles */
		.landing-container {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 2rem;
			position: relative;
		}
		
		.admin-link {
			position: absolute;
			top: 1.5rem;
			right: 2rem;
			background: rgba(255, 255, 255, 0.2);
			backdrop-filter: blur(10px);
			color: white;
			padding: 0.5rem 1rem;
			border-radius: 8px;
			text-decoration: none;
			font-size: 0.9rem;
			font-weight: 500;
			transition: all 0.2s;
		}
		
		.admin-link:hover {
			background: rgba(255, 255, 255, 0.3);
			transform: translateY(-2px);
		}
		
		.logo-section {
			text-align: center;
			margin-bottom: 3rem;
		}
		
		.logo-title {
			font-size: 4rem;
			font-weight: 700;
			color: white;
			margin-bottom: 0.5rem;
			text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
		}
		
		.logo-subtitle {
			font-size: 1.5rem;
			color: rgba(255, 255, 255, 0.9);
			font-weight: 400;
		}
		
		.action-buttons {
			display: flex;
			gap: 1.5rem;
			margin-bottom: 3rem;
		}
		
		.action-button {
			background: white;
			color: #667eea;
			padding: 1rem 2.5rem;
			border-radius: 12px;
			text-decoration: none;
			font-size: 1.2rem;
			font-weight: 600;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
			transition: all 0.3s;
			border: none;
			cursor: pointer;
		}
		
		.action-button:hover {
			transform: translateY(-3px);
			box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
		}
		
		.action-button.primary {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
		}
		
		.stats-section {
			background: rgba(255, 255, 255, 0.15);
			backdrop-filter: blur(10px);
			border-radius: 16px;
			padding: 2rem;
			min-width: 500px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
		}
		
		.stats-title {
			color: white;
			font-size: 1.3rem;
			font-weight: 600;
			margin-bottom: 1.5rem;
			text-align: center;
		}
		
		.stats-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1rem;
		}
		
		.stat-item {
			background: rgba(255, 255, 255, 0.1);
			padding: 1rem;
			border-radius: 10px;
			text-align: center;
		}
		
		.stat-label {
			color: rgba(255, 255, 255, 0.8);
			font-size: 0.9rem;
			margin-bottom: 0.5rem;
		}
		
		.stat-value {
			color: white;
			font-size: 1.8rem;
			font-weight: 700;
		}
		
		.game-state {
			grid-column: 1 / -1;
			background: rgba(255, 255, 255, 0.2);
			padding: 1.2rem;
			border-radius: 10px;
			text-align: center;
		}
		
		.game-state-label {
			color: rgba(255, 255, 255, 0.8);
			font-size: 0.9rem;
			margin-bottom: 0.5rem;
		}
		
		.game-state-value {
			color: white;
			font-size: 1.5rem;
			font-weight: 700;
		}
		
		.state-before-game { color: #ffd700; }
		.state-waiting { color: #90ee90; }
		.state-counting-down { color: #ffa500; }
		.state-playing { color: #00ff00; }
		.state-after-game { color: #ff6b6b; }
		
		@media (max-width: 768px) {
			.logo-title {
				font-size: 2.5rem;
			}
			
			.logo-subtitle {
				font-size: 1.2rem;
			}
			
			.action-buttons {
				flex-direction: column;
				width: 100%;
			}
			
			.action-button {
				width: 100%;
			}
			
			.stats-section {
				min-width: auto;
				width: 100%;
			}
		}
	</style>
</head>
<body>
	<div class="landing-container">
		<a href="/admin" class="admin-link">Admin</a>
		
		<div class="logo-section">
			<div class="logo-title">Closest Wins</div>
			<div class="logo-subtitle">by Flower Games</div>
		</div>
		
		<div class="action-buttons">
			<a href="/spectate" class="action-button">🔭 Spectate</a>
			<a href="/join" class="action-button primary">🎮 Join Game</a>
		</div>
		
		<div class="stats-section" th:if="${game != null}">
			<div class="stats-title">Current Game</div>
			<div class="stats-grid">
				<div class="game-state">
					<div class="game-state-label">Game State</div>
					<div class="game-state-value" th:classappend="${'state-' + #strings.toLowerCase(#strings.replace(game.state, '_', '-'))}">
						<span th:if="${game.state.name() == 'BEFORE_GAME'}">🎮 Ready to Start</span>
						<span th:if="${game.state.name() == 'WAITING'}">⏸️ Waiting</span>
						<span th:if="${game.state.name() == 'COUNTING_DOWN'}">⏳ Countdown</span>
						<span th:if="${game.state.name() == 'PLAYING'}">▶️ Playing</span>
						<span th:if="${game.state.name() == 'AFTER_GAME'}">🏁 Game Over</span>
					</div>
				</div>
				
				<div class="stat-item">
					<div class="stat-label">Total Locations</div>
					<div class="stat-value" th:text="${totalLocations}">0</div>
				</div>
				
				<div class="stat-item">
					<div class="stat-label">Current Location</div>
					<div class="stat-value" th:text="${currentLocationNumber}">0</div>
				</div>
				
				<div class="stat-item" style="grid-column: 1 / -1;">
					<div class="stat-label">Players</div>
					<div class="stat-value" th:text="${playerCount}">0</div>
				</div>
			</div>
		</div>
		
		<div class="stats-section" th:if="${game == null}">
			<div class="stats-title">No Active Game</div>
			<p style="color: rgba(255, 255, 255, 0.8); text-align: center;">
				There is currently no active game. An admin needs to create one first.
			</p>
		</div>
	</div>
</body>
</html>
